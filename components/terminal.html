<!-- DEVELOPER TERMINAL COMPONENT -->
<div id="terminal-overlay" role="dialog" aria-modal="true" aria-label="Developer Terminal">
    <div class="terminal-window">
        <div class="terminal-titlebar">
            <div class="term-dot term-dot-red" id="term-close-dot" title="Close Terminal"></div>
            <div class="term-dot term-dot-yellow" id="term-min-dot" title="Minimize"></div>
            <div class="term-dot term-dot-green" id="term-max-dot" title="Maximize"></div>
            <span class="terminal-title-text">harsh@universe:~$</span>
            <span class="terminal-shortcut-hint">ESC to close</span>
        </div>
        <div class="terminal-body">
            <div class="terminal-output" id="terminal-output"></div>
        </div>
        <div class="terminal-autocomplete" id="term-autocomplete"></div>
        <div class="terminal-input-row">
            <span class="terminal-input-prompt">harsh@universe:~$&nbsp;</span>
            <input type="text" id="terminal-input" autocomplete="off" spellcheck="false" aria-label="Terminal command input" placeholder="type a command... (e.g. help, projects, search react)">
        </div>
    </div>
</div>
