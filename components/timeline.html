<!-- TIMELINE & ACHIEVEMENTS SECTION -->
<section id="experience" aria-labelledby="education-title">
    <div class="container">
        <div class="section-header">
            <span class="section-subtitle">Background</span>
            <h2 class="section-title" id="education-title">Education & Milestones</h2>
        </div>
        <div class="timeline-container" id="timeline-container">
            <svg class="timeline-svg-line" preserveAspectRatio="none" aria-hidden="true">
                <defs>
                    <linearGradient id="line-gradient" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#8b5cf6"/>
                        <stop offset="50%" stop-color="#3b82f6"/>
                        <stop offset="100%" stop-color="#06b6d4"/>
                    </linearGradient>
                </defs>
                <line x1="2" y1="0" x2="2" y2="100%"/>
                <line x1="2" y1="0" x2="2" y2="100%" class="progress-line" id="timelineProgress"/>
            </svg>
            <div id="timeline-items-wrapper"></div>
        </div>

        <div class="achievements-grid" id="achievements-grid"></div>
    </div>
</section>
