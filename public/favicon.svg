<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Deep Void Charcoal -->
    <linearGradient id="aether-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="100%" stop-color="#020306"/>
    </linearGradient>

    <!-- Chrome / Titanium Monogram Gradient (Crisp silver-white) -->
    <linearGradient id="hd-chrome" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Luminous Cool-Blue Orbit Gradient -->
    <linearGradient id="orbit-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#93c5fd" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#c7d2fe" stop-opacity="1"/>
    </linearGradient>

    <!-- Star Radiant Core -->
    <radialGradient id="star-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep Obsidian Rounded Container (Squircle) with Restrained Hairline Border -->
  <rect width="64" height="64" rx="14" fill="url(#aether-bg)"/>
  <rect width="64" height="64" rx="14" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- ======================================================== -->
  <!-- LAYER 1: ORBIT REAR ARC (Passes behind H & D at top)    -->
  <!-- ======================================================== -->
  <g transform="rotate(-18 32 33)">
    <path d="M 12 33 A 22 7.2 0 0 1 52 33"
          fill="none" stroke="url(#orbit-glow)" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- ======================================================== -->
  <!-- LAYER 2: FOUR-POINT STAR SPARKLE (Centered on Orbit)    -->
  <!-- ======================================================== -->
  <g transform="translate(42.2, 22.2)">
    <circle cx="0" cy="0" r="3.2" fill="url(#star-glow)"/>
    <path d="M 0 -4.2 Q 0.3 -0.5 4.2 0 Q 0.3 0.5 0 4.2 Q -0.3 0.5 -4.2 0 Q -0.3 -0.5 0 -4.2 Z"
          fill="#ffffff"/>
    <circle cx="0" cy="0" r="0.7" fill="#ffffff"/>
  </g>

  <!-- ======================================================== -->
  <!-- LAYER 3: LETTER H                                        -->
  <!-- ======================================================== -->
  <path d="M 20.8 22.2
           L 24.8 17.5
           L 24.8 31.0
           L 33.2 31.0
           L 33.2 22.2
           L 37.2 22.2
           L 37.2 41.2
           L 33.2 45.2
           L 33.2 34.8
           L 24.8 34.8
           L 24.8 41.5
           L 20.8 45.5
           Z"
        fill="url(#hd-chrome)"/>

  <!-- ======================================================== -->
  <!-- LAYER 4: ORBIT FRONT ARC (Crosses in front of H left)   -->
  <!-- ======================================================== -->
  <g transform="rotate(-18 32 33)">
    <path d="M 52 33 A 22 7.2 0 0 1 12 33"
          fill="none" stroke="url(#orbit-glow)" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- ======================================================== -->
  <!-- LAYER 5: LETTER D (Rendered in front of right orbit arc) -->
  <!-- ======================================================== -->
  <path fill-rule="evenodd" d="
    M 37.2 26.2
    C 43.5 26.2 48.8 29.5 48.8 35.5
    C 48.8 41.2 43.5 44.8 37.2 44.8
    L 37.2 43.2
    L 33.2 47.2
    L 41.2 47.2
    C 48.8 47.2 53.2 42.2 53.2 35.5
    C 53.2 28.5 48.8 26.2 41.2 26.2
    L 37.2 26.2
    Z
    M 37.2 30.0
    L 37.2 41.0
    C 41.2 41.0 44.6 38.8 44.6 35.5
    C 44.6 32.2 41.2 30.0 37.2 30.0
    Z"
    fill="url(#hd-chrome)"/>
</svg>