<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Invite Luxury RSVP Event Experience Platform">
  <defs>
    <linearGradient id="inv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06050b"/>
      <stop offset="50%" stop-color="#0f0c1b"/>
      <stop offset="100%" stop-color="#07060f"/>
    </linearGradient>
    <radialGradient id="inv-gold" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="rgba(245, 158, 11, 0.25)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <linearGradient id="inv-gold-text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#inv-bg)"/>
  <rect width="1200" height="675" fill="url(#inv-gold)"/>

  <!-- Ornate Luxury Border -->
  <rect x="60" y="45" width="1080" height="585" rx="16" fill="none" stroke="rgba(245, 158, 11, 0.25)" stroke-width="1.5"/>
  <rect x="75" y="60" width="1050" height="555" rx="12" fill="none" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>

  <!-- Crest -->
  <g transform="translate(600, 140)">
    <circle cx="0" cy="0" r="45" fill="rgba(245, 158, 11, 0.12)" stroke="#f59e0b" stroke-width="1.8"/>
    <text x="0" y="10" text-anchor="middle" fill="#fbbf24" font-family="'Cinzel', serif" font-size="28" font-weight="700">✦</text>
  </g>

  <!-- Typography -->
  <g transform="translate(600, 240)">
    <text x="0" y="0" text-anchor="middle" fill="#d97706" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="0.3em">THE PRIVATE ATELIER INVITATION</text>
    <text x="0" y="55" text-anchor="middle" fill="url(#inv-gold-text)" font-family="'Cinzel', 'Times New Roman', serif" font-size="44" font-weight="800" letter-spacing="0.1em">You Are Cordially Invited</text>
    <text x="0" y="90" text-anchor="middle" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="400">A bespoke digital RSVP experience powered by Next.js and Vercel Edge compute</text>
  </g>

  <!-- Card Actions -->
  <g transform="translate(600, 420)">
    <rect x="-180" y="-24" width="360" height="50" rx="25" fill="#f59e0b" filter="drop-shadow(0 4px 15px rgba(245, 158, 11, 0.4))"/>
    <text x="0" y="8" text-anchor="middle" fill="#000000" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">CONFIRM ATTENDANCE • RSVP</text>
  </g>

  <g transform="translate(600, 520)">
    <rect x="-260" y="-18" width="520" height="36" rx="18" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)"/>
    <text x="0" y="5" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">
      NEXT.JS • VERCEL EDGE • REAL-TIME CONFIRMATION • ZERO DATABASE BOTTLENECKS
    </text>
  </g>
</svg>