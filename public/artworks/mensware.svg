<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="MENSWARE Architectural Gothic Luxury Men's Accessories Storefront">
  <defs>
    <linearGradient id="mw-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040406"/>
      <stop offset="60%" stop-color="#08080d"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <radialGradient id="mw-crimson" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="rgba(185, 28, 28, 0.22)"/>
      <stop offset="60%" stop-color="rgba(127, 29, 29, 0.06)"/>
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)"/>
    </radialGradient>
    <linearGradient id="mw-silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#mw-bg)"/>
  <rect width="1200" height="675" fill="url(#mw-crimson)"/>

  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="675"/>
    <line x1="360" y1="0" x2="360" y2="675"/>
    <line x1="840" y1="0" x2="840" y2="675"/>
    <line x1="1120" y1="0" x2="1120" y2="675"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="595" x2="1200" y2="595"/>
    <circle cx="600" cy="337" r="260"/>
  </g>

  <text x="600" y="380" text-anchor="middle" fill="rgba(255, 255, 255, 0.03)" font-family="'Cinzel', 'Times New Roman', serif" font-size="160" font-weight="900" letter-spacing="0.25em">MENSWARE</text>

  <g transform="translate(600, 55)">
    <text x="0" y="0" text-anchor="middle" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="0.28em">ATELIER N° 01 • AUTUMN — WINTER MMXXVI • [28°38'N 77°13'E]</text>
  </g>

  <g transform="translate(600, 115)">
    <text x="0" y="0" text-anchor="middle" fill="url(#mw-silver)" font-family="'Cinzel', 'Times New Roman', serif" font-size="44" font-weight="800" letter-spacing="0.16em">MENSWARE<tspan fill="#ef4444">.</tspan></text>
    <text x="0" y="28" text-anchor="middle" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" letter-spacing="0.08em">ARCHITECTURAL GOTHIC LUXURY MEN'S ACCESSORIES &amp; EDITORIAL COMMERCE</text>
  </g>

  <g transform="translate(100, 175)">
    <!-- Product Card 1: Timepiece -->
    <g transform="translate(0, 0)">
      <rect width="310" height="370" rx="14" fill="rgba(15, 15, 22, 0.85)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.2"/>
      <g transform="translate(155, 120)">
        <circle cx="0" cy="0" r="75" fill="#0b0b10" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 3"/>
        <circle cx="0" cy="0" r="68" fill="#040407" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
        <line x1="0" y1="-60" x2="0" y2="-52" stroke="#fff" stroke-width="2"/>
        <line x1="60" y1="0" x2="52" y2="0" stroke="#fff" stroke-width="2"/>
        <line x1="0" y1="60" x2="0" y2="52" stroke="#fff" stroke-width="2"/>
        <line x1="-60" y1="0" x2="-52" y2="0" stroke="#fff" stroke-width="2"/>
        <line x1="0" y1="0" x2="22" y2="-28" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="0" y1="0" x2="-35" y2="10" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="0" cy="0" r="4" fill="#ef4444"/>
      </g>
      <text x="155" y="235" text-anchor="middle" fill="#ffffff" font-family="'Cinzel', serif" font-size="16" font-weight="700">The Chronograph Obsidian</text>
      <text x="155" y="258" text-anchor="middle" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">Sculpted Black Steel • Sapphire Glass</text>
      <g transform="translate(45, 290)">
        <rect width="220" height="36" rx="6" fill="rgba(239, 68, 68, 0.1)" stroke="rgba(239, 68, 68, 0.3)"/>
        <text x="110" y="23" text-anchor="middle" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">ATELIER CURATED N° 01</text>
      </g>
    </g>

    <!-- Center Narrative & Architecture Card -->
    <g transform="translate(345, 0)">
      <rect width="310" height="370" rx="14" fill="rgba(15, 15, 22, 0.85)" stroke="rgba(239, 68, 68, 0.28)" stroke-width="1.5"/>
      <g transform="translate(25, 35)">
        <text x="0" y="0" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">SYSTEM ARCHITECTURE</text>
        <text x="0" y="28" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700">Full-Stack Commerce</text>
        <line x1="0" y1="42" x2="260" y2="42" stroke="rgba(255, 255, 255, 0.1)"/>
        
        <g transform="translate(0, 65)">
          <rect width="260" height="42" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)"/>
          <text x="14" y="26" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">EXPRESS 5 COMMERCE API</text>
          <text x="215" y="26" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11">200 OK</text>
        </g>
        <g transform="translate(0, 118)">
          <rect width="260" height="42" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)"/>
          <text x="14" y="26" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">MONGODB CART &amp; INVENTORY</text>
          <text x="220" y="26" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">SYNC</text>
        </g>
        <g transform="translate(0, 171)">
          <rect width="260" height="42" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)"/>
          <text x="14" y="26" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">EDITORIAL STOREFRONT</text>
          <text x="220" y="26" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11">LIVE</text>
        </g>

        <g transform="translate(0, 240)">
          <text x="0" y="0" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Fine timepieces, handcrafted leathers, and sculpted steel forged in shadow.</text>
        </g>
      </g>
    </g>

    <!-- Product Card 2: Handcrafted Leather -->
    <g transform="translate(690, 0)">
      <rect width="310" height="370" rx="14" fill="rgba(15, 15, 22, 0.85)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.2"/>
      <g transform="translate(155, 120)">
        <rect x="-65" y="-50" width="130" height="100" rx="12" fill="#140a08" stroke="#d97706" stroke-width="1.8"/>
        <path d="M -40 -50 C -40 -70, 40 -70, 40 -50" fill="none" stroke="#d97706" stroke-width="2.5"/>
        <line x1="-65" y1="-10" x2="65" y2="-10" stroke="rgba(217, 119, 6, 0.4)" stroke-width="1.5" stroke-dasharray="4 2"/>
        <circle cx="0" cy="-10" r="7" fill="#fbbf24"/>
      </g>
      <text x="155" y="235" text-anchor="middle" fill="#ffffff" font-family="'Cinzel', serif" font-size="16" font-weight="700">Handcrafted Weekender</text>
      <text x="155" y="258" text-anchor="middle" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">Full-Grain Tuscan Leather • Brass</text>
      <g transform="translate(45, 290)">
        <rect width="220" height="36" rx="6" fill="rgba(217, 119, 6, 0.1)" stroke="rgba(217, 119, 6, 0.3)"/>
        <text x="110" y="23" text-anchor="middle" fill="#fde68a" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">HANDMADE BESPOKE</text>
      </g>
    </g>
  </g>

  <g transform="translate(600, 620)">
    <rect x="-350" y="-18" width="700" height="36" rx="18" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)"/>
    <text x="0" y="5" text-anchor="middle" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">
      <tspan fill="#ef4444">NODE.JS 20</tspan> • <tspan fill="#38bdf8">EXPRESS 5</tspan> • <tspan fill="#34d399">MONGODB</tspan> • <tspan fill="#fbbf24">GITHUB PAGES LIVE STOREFRONT</tspan>
    </text>
  </g>
</svg>