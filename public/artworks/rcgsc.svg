<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">RCGSC Practice Website Preview</title>
  <desc id="desc">Stylized preview card for the Rotaract Club of Ghanshyamdas Saraf College practice website.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080812"/>
