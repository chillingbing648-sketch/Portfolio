<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="BenchWarmers Football Training & Tactical Drills Hub">
  <defs>
    <linearGradient id="bw-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#031208"/>
      <stop offset="100%" stop-color="#082312"/>
    </linearGradient>
    <radialGradient id="bw-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="rgba(34, 197, 94, 0.22)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bw-bg)"/>
  <rect width="1200" height="675" fill="url(#bw-glow)"/>

  <!-- Tactical Pitch Lines -->
  <g stroke="rgba(34, 197, 94, 0.35)" stroke-width="2" fill="none">
    <rect x="150" y="100" width="900" height="475" rx="12"/>
    <line x1="600" y1="100" x2="600" y2="575"/>
    <circle cx="600" cy="337" r="85"/>
    <circle cx="600" cy="337" r="4" fill="#22c55e"/>

    <!-- Left Box -->
    <rect x="150" y="212" width="160" height="250"/>
    <rect x="150" y="272" width="60" height="130"/>
    <circle cx="310" cy="337" r="3" fill="#22c55e"/>

    <!-- Right Box -->
    <rect x="890" y="212" width="160" height="250"/>
    <rect x="990" y="272" width="60" height="130"/>
    <circle cx="890" cy="337" r="3" fill="#22c55e"/>
  </g>

  <!-- Tactical Movement Arrows -->
  <g stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-dasharray="6 4">
    <path d="M 380 200 Q 480 160 560 210" marker-end="url(#arrow)"/>
    <path d="M 420 440 Q 520 480 620 440" marker-end="url(#arrow)"/>
    <path d="M 680 250 L 780 220"/>
  </g>

  <!-- Player Position Nodes -->
  <g transform="translate(380, 200)">
    <circle cx="0" cy="0" r="14" fill="#22c55e" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="4" text-anchor="middle" fill="#000" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800">11</text>
  </g>
  <g transform="translate(680, 250)">
    <circle cx="0" cy="0" r="14" fill="#eab308" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="4" text-anchor="middle" fill="#000" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800">10</text>
  </g>
  <g transform="translate(780, 220)">
    <circle cx="0" cy="0" r="14" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="4" text-anchor="middle" fill="#fff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800">09</text>
  </g>
  <g transform="translate(420, 440)">
    <circle cx="0" cy="0" r="14" fill="#22c55e" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="4" text-anchor="middle" fill="#000" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800">07</text>
  </g>

  <!-- Floating HUD Panel -->
  <g transform="translate(600, 50)">
    <text x="0" y="0" text-anchor="middle" fill="#86efac" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="0.2em">BENCHWARMERS FOOTBALL DRILLS &amp; TACTICAL HUB</text>
  </g>

  <g transform="translate(600, 615)">
    <rect x="-320" y="-18" width="640" height="36" rx="18" fill="rgba(10, 30, 16, 0.9)" stroke="rgba(34, 197, 94, 0.3)"/>
    <text x="0" y="5" text-anchor="middle" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">
      <tspan fill="#22c55e">VANILLA JS ESM</tspan> • <tspan fill="#38bdf8">TACTICAL CANVAS</tspan> • <tspan fill="#facc15">DRILLS ENGINE</tspan> • <tspan fill="#ffffff">SPORTS ANALYTICS</tspan>
    </text>
  </g>
</svg>