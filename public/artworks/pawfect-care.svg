<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Pawfect-care Pet Welfare and Community Adoption Portal">
  <defs>
    <linearGradient id="pc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04120e"/>
      <stop offset="100%" stop-color="#08241b"/>
    </linearGradient>
    <radialGradient id="pc-glow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.25)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#pc-bg)"/>
  <rect width="1200" height="675" fill="url(#pc-glow)"/>

  <!-- Header -->
  <g transform="translate(600, 70)">
    <circle cx="0" cy="0" r="32" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="2"/>
    <text x="0" y="10" text-anchor="middle" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="24">🐾</text>
    <text x="0" y="55" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="32" font-weight="800">Pawfect Care Community</text>
    <text x="0" y="85" text-anchor="middle" fill="#a7f3d0" font-family="'JetBrains Mono', monospace" font-size="12">PET WELFARE &amp; VERIFIED ADOPTION REGISTRY</text>
  </g>

  <!-- Adoption Cards Stage -->
  <g transform="translate(180, 220)">
    <!-- Pet Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="390" height="280" rx="16" fill="rgba(10, 30, 23, 0.85)" stroke="#10b981" stroke-width="1.5"/>
      <circle cx="65" cy="65" r="32" fill="rgba(16, 185, 129, 0.2)"/>
      <text x="65" y="74" text-anchor="middle" fill="#34d399" font-size="24">🐕</text>
      <text x="120" y="55" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700">Milo</text>
      <text x="120" y="80" fill="#a7f3d0" font-family="'JetBrains Mono', monospace" font-size="12">Golden Retriever • 2 Years</text>
      <line x1="30" y1="120" x2="360" y2="120" stroke="rgba(255, 255, 255, 0.08)"/>
      <g transform="translate(30, 140)">
        <rect width="140" height="30" rx="6" fill="rgba(52, 211, 153, 0.15)"/>
        <text x="70" y="19" text-anchor="middle" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10">✓ FULLY VACCINATED</text>
        <rect x="155" y="0" width="130" height="30" rx="6" fill="rgba(56, 189, 248, 0.15)"/>
        <text x="220" y="19" text-anchor="middle" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">✓ MICROCHIPPED</text>
      </g>
      <text x="30" y="215" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Gentle, leash-trained, and friendly with families and other rescues.</text>
      <g transform="translate(30, 235)">
        <text x="0" y="15" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">STATUS: READY FOR LOVING HOME</text>
      </g>
    </g>

    <!-- Pet Card 2 -->
    <g transform="translate(450, 0)">
      <rect width="390" height="280" rx="16" fill="rgba(10, 30, 23, 0.85)" stroke="#10b981" stroke-width="1.5"/>
      <circle cx="65" cy="65" r="32" fill="rgba(16, 185, 129, 0.2)"/>
      <text x="65" y="74" text-anchor="middle" fill="#34d399" font-size="24">🐈</text>
      <text x="120" y="55" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700">Luna</text>
      <text x="120" y="80" fill="#a7f3d0" font-family="'JetBrains Mono', monospace" font-size="12">Domestic Shorthair • 1 Year</text>
      <line x1="30" y1="120" x2="360" y2="120" stroke="rgba(255, 255, 255, 0.08)"/>
      <g transform="translate(30, 140)">
        <rect width="140" height="30" rx="6" fill="rgba(52, 211, 153, 0.15)"/>
        <text x="70" y="19" text-anchor="middle" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10">✓ HEALTH VERIFIED</text>
        <rect x="155" y="0" width="130" height="30" rx="6" fill="rgba(244, 114, 182, 0.15)"/>
        <text x="220" y="19" text-anchor="middle" fill="#f472b6" font-family="'JetBrains Mono', monospace" font-size="10">✓ INDOOR RESCUE</text>
      </g>
      <text x="30" y="215" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Playful, affectionate companion rescued from community foster network.</text>
      <g transform="translate(30, 235)">
        <text x="0" y="15" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">STATUS: ADOPTION APPLICATION OPEN</text>
      </g>
    </g>
  </g>

  <!-- Bottom Tech Bar -->
  <g transform="translate(600, 610)">
    <rect x="-300" y="-18" width="600" height="36" rx="18" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(16, 185, 129, 0.3)"/>
    <text x="0" y="5" text-anchor="middle" fill="#a7f3d0" font-family="'JetBrains Mono', monospace" font-size="11">
      SEMANTIC HTML5 • RESPONSIVE CSS3 • ACCESSIBLE FORMS • COMMUNITY RESCUE
    </text>
  </g>
</svg>