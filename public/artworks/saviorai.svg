<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="SaviorAI Safety Intelligence Architecture Overview">
  <defs>
    <linearGradient id="sa-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050a12"/>
      <stop offset="100%" stop-color="#0b1728"/>
    </linearGradient>
    <radialGradient id="sa-glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(14, 165, 233, 0.25)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#sa-bg)"/>
  <rect width="1200" height="675" fill="url(#sa-glow)"/>

  <!-- Radar scan rings -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1.2">
    <circle cx="600" cy="340" r="140"/>
    <circle cx="600" cy="340" r="230"/>
    <circle cx="600" cy="340" r="320"/>
    <line x1="150" y1="340" x2="1050" y2="340"/>
    <line x1="600" y1="40" x2="600" y2="640"/>
  </g>

  <!-- Header Header -->
  <g transform="translate(600, 65)">
    <rect x="-240" y="-18" width="480" height="36" rx="18" fill="rgba(14, 165, 233, 0.12)" stroke="rgba(56, 189, 248, 0.3)"/>
    <circle cx="-210" cy="0" r="5" fill="#38bdf8"/>
    <text x="0" y="5" text-anchor="middle" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">CRITICAL SAFETY INTELLIGENCE • EMERGENCY GATES</text>
  </g>

  <g transform="translate(600, 130)">
    <text x="0" y="0" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="36" font-weight="800">SaviorAI Telemetry &amp; Safety Triage</text>
    <text x="0" y="28" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">Deterministic safety gates &amp; AI-assisted clinical injury monitoring</text>
  </g>

  <!-- Telemetry Stage -->
  <g transform="translate(120, 200)">
    <!-- Card 1: Safety Gates -->
    <g transform="translate(0, 0)">
      <rect width="300" height="350" rx="14" fill="rgba(10, 20, 36, 0.85)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5"/>
      <g transform="translate(24, 35)">
        <text x="0" y="0" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">DETERMINISTIC SAFETY GATES</text>
        <text x="0" y="26" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700">Triage Escalation</text>
        <line x1="0" y1="38" x2="252" y2="38" stroke="rgba(255, 255, 255, 0.08)"/>

        <g transform="translate(0, 60)">
          <rect width="252" height="38" rx="6" fill="rgba(239, 68, 68, 0.12)" stroke="rgba(239, 68, 68, 0.3)"/>
          <text x="12" y="23" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="11">CODE RED: Immediate Trauma</text>
        </g>
        <g transform="translate(0, 110)">
          <rect width="252" height="38" rx="6" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(245, 158, 11, 0.3)"/>
          <text x="12" y="23" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11">CODE AMBER: Clinical Review</text>
        </g>
        <g transform="translate(0, 160)">
          <rect width="252" height="38" rx="6" fill="rgba(52, 211, 153, 0.12)" stroke="rgba(52, 211, 153, 0.3)"/>
          <text x="12" y="23" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11">CODE GREEN: First-Aid Protocol</text>
        </g>
      </g>
    </g>

    <!-- Center Radar Scope -->
    <g transform="translate(330, 0)">
      <rect width="300" height="350" rx="14" fill="rgba(10, 20, 36, 0.85)" stroke="rgba(14, 165, 233, 0.4)" stroke-width="1.8"/>
      <g transform="translate(150, 140)">
        <circle cx="0" cy="0" r="95" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="4 3"/>
        <circle cx="0" cy="0" r="75" fill="rgba(14, 165, 233, 0.08)" stroke="#38bdf8" stroke-width="1.5"/>
        <line x1="-80" y1="0" x2="80" y2="0" stroke="rgba(56, 189, 248, 0.4)"/>
        <line x1="0" y1="-80" x2="0" y2="80" stroke="rgba(56, 189, 248, 0.4)"/>
        <polygon points="0,-16 16,0 0,16 -16,0" fill="#38bdf8"/>
        <!-- Medical Cross In Center -->
        <path d="M -6 -18 H 6 V -6 H 18 V 6 H 6 V 18 H -6 V 6 H -18 V -6 H -6 Z" fill="#ffffff"/>
      </g>
      <text x="150" y="270" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">Real-Time Risk Analysis</text>
      <text x="150" y="295" text-anchor="middle" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">LATENCY: 14ms • GEMINI AI GATES</text>
    </g>

    <!-- Card 3: Architecture -->
    <g transform="translate(660, 0)">
      <rect width="300" height="350" rx="14" fill="rgba(10, 20, 36, 0.85)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5"/>
      <g transform="translate(24, 35)">
        <text x="0" y="0" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">PRIVACY &amp; COMPLIANCE</text>
        <text x="0" y="26" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700">Zero Cloud Data Retention</text>
        <line x1="0" y1="38" x2="252" y2="38" stroke="rgba(255, 255, 255, 0.08)"/>

        <text x="0" y="70" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Patient telemetry is sanitized client-side. Emergency routing invokes localized response dispatch.</text>
        
        <g transform="translate(0, 130)">
          <rect width="252" height="42" rx="8" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.08)"/>
          <text x="12" y="26" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11">✓ VERIFIED SAFETY THRESHOLD</text>
        </g>
        <g transform="translate(0, 185)">
          <rect width="252" height="42" rx="8" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.08)"/>
          <text x="12" y="26" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">✓ REACT 19 + TYPESCRIPT 5.8</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(600, 615)">
    <text x="0" y="0" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">
      REACT 19 • TYPESCRIPT • VITE • EXPRESS API • GEMINI 2.0 FLASH • DISPATCH READY
    </text>
  </g>
</svg>